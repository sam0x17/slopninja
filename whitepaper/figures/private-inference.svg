<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Attested private inference and customer-directed disclosure</title>
  <desc id="desc">The customer verifies hardware and workload evidence, then encrypts to the protected instance key. Private B weights execute in the attested CPU and GPU environment. The miner hosts the instance but receives no customer key. Results return encrypted to the customer, who may separately disclose evidence to a validator.</desc>
  <defs>
    <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#087f5b"/></marker>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ad7b00"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="570" fill="white"/>
  <g fill="none" stroke-width="2">
    <path d="M320 165 C445 75 550 65 700 65" stroke="#087f5b" marker-end="url(#green)"/>
    <path d="M700 105 C540 115 460 180 320 195" stroke="#087f5b" marker-end="url(#green)"/>
    <path d="M320 225 L700 225" stroke="#ad7b00" stroke-dasharray="9 6" marker-end="url(#amber)"/>
    <path d="M320 250 C430 350 555 360 700 360" stroke="#475569" marker-end="url(#gray)"/>
    <path d="M1020 65 H1080 V360 H1020" stroke="#475569" marker-end="url(#gray)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round">
    <text x="495" y="65">Input encrypted to instance</text>
    <text x="510" y="165">Encrypted result and receipt</text>
    <text x="510" y="208">Optional encrypted evidence</text>
    <text x="485" y="305">Public job metadata</text>
    <text x="485" y="331">and commitments</text>
    <text x="1135" y="211">Job</text>
    <text x="1135" y="237">state</text>
  </g>
  <g stroke-width="2">
    <rect x="20" y="150" width="300" height="100" rx="15" fill="#e6f6f0" stroke="#087f5b"/>
    <rect x="700" y="20" width="320" height="100" rx="15" fill="#e6f6f0" stroke="#087f5b"/>
    <rect x="700" y="175" width="320" height="100" rx="15" fill="#fff8e6" stroke="#ad7b00"/>
    <rect x="700" y="310" width="320" height="100" rx="15" fill="#f8fafc" stroke="#64748b"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" fill="#0f172a">
    <text x="170" y="185">Customer</text><text x="170" y="216" font-size="17">Verifies evidence, then encrypts</text>
    <text x="860" y="59" font-size="20">Attested CPU/GPU instance</text><text x="860" y="90" font-size="17">Private B + approved runtime</text>
    <text x="860" y="144" font-size="17">Miner hosts; no customer key</text>
    <text x="860" y="214">Specific validator</text><text x="860" y="245" font-size="19">Customer-directed inspection</text>
    <text x="860" y="348">Chain / transport</text><text x="860" y="379" font-size="18">Commitments, ciphertext, payments</text>
  </g>
  <rect x="20" y="435" width="1160" height="115" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="600" y="468" font-size="23">B weights remain private. No mandatory monthly release.</text>
    <text x="600" y="500" font-size="20">Privacy depends on verified hardware, application policy and the customer client.</text>
    <text x="600" y="528" font-size="18">Ordinary hosting grants operator access. Attested jobs cannot silently downgrade.</text>
  </g>
</svg>
