<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Private B weights and private customer text</title>
  <desc id="desc">The model owner and customer independently verify the protected runtime before providing encrypted model material and text. Only that runtime computes on both plaintexts. The customer receives an encrypted revision. A separate host obtains neither secret. The chain receives only permitted metadata.</desc>
  <defs>
    <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#087f5b"/></marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2563eb"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="580" fill="white"/>
  <g fill="none" stroke-width="2.5">
    <path d="M180 120 V240 H380" stroke="#2563eb" marker-end="url(#blue)"/>
    <path d="M960 120 V240 H820" stroke="#087f5b" marker-end="url(#green)"/>
    <path d="M820 315 H1120 V120" stroke="#087f5b" marker-end="url(#green)"/>
    <path d="M600 355 V410" stroke="#475569" marker-end="url(#gray)"/>
  </g>
  <g stroke-width="2">
    <rect x="20" y="20" width="320" height="100" rx="15" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="860" y="20" width="320" height="100" rx="15" fill="#e6f6f0" stroke="#087f5b"/>
    <rect x="380" y="195" width="440" height="160" rx="15" fill="#e6f6f0" stroke="#087f5b"/>
    <rect x="400" y="410" width="400" height="75" rx="15" fill="#f8fafc" stroke="#64748b"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="180" y="59" font-size="23">B model owner</text>
    <text x="180" y="91" font-size="18">Retains original private weights</text>
    <text x="1020" y="59" font-size="23">Customer</text>
    <text x="1020" y="91" font-size="18">Owns draft, references and brief</text>
    <text x="600" y="67" font-size="21">Independent verification</text>
    <text x="600" y="95" font-size="19">Independent key release</text>
    <text x="600" y="234" font-size="24">Protected CPU/GPU runtime</text>
    <text x="600" y="270" font-size="20">Public, reviewed execution code</text>
    <text x="600" y="302" font-size="20">Private weights + private text</text>
    <text x="600" y="332" font-size="17">No operator log, debug or export access</text>
    <text x="600" y="441" font-size="21">Chain / transport</text>
    <text x="600" y="468" font-size="18">Permitted metadata and commitments only</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round">
    <text x="200" y="171">Encrypted model package</text>
    <text x="200" y="199">Owner releases model key</text>
    <text x="966" y="168">Encrypted customer input</text>
    <text x="977" y="291">Encrypted revision</text>
    <text x="989" y="346">Only the customer can decrypt</text>
    <text x="600" y="387">Public job state</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#334155">
    <text x="600" y="522" font-size="21">A separate compute host receives neither secret. Paid B has no ordinary-hosting fallback.</text>
    <text x="600" y="553" font-size="19">Privacy depends on qualified hardware, the accepted runtime and each party's verifier.</text>
  </g>
</svg>
